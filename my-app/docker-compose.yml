services:
  frontend:
    image: my-app-frontend-prod
    build:
      context: ./frontend
      dockerfile: Dockerfile

  backend:
    image: my-app-backend-prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - MONGODB_URI=mongodb://root:example@mongo:27017/bloglist?authSource=admin
      - PORT=3003
      - SECRET=your_prod_secret
    depends_on:
      - mongo

  mongo:
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo_data:/data/db

  nginx:
    image: nginx:1.29
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    depends_on:
      - frontend
      - backend

volumes:
  mongo_data: